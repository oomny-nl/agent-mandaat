[project]
name = "agent-mandaat"
version = "0.1.0"
description = "AI-agent met eigen identiteit, gedelegeerd mandaat per taak, intrekking en audit (Keycloak, MCP, LangGraph)"
readme = "README.md"
license = "EUPL-1.2"
authors = [{ name = "Michael Owen Meijer", email = "michael@oomny.nl" }]
requires-python = ">=3.13,<3.14"
dependencies = [
    "mcp==2.3.0",
    "httpx2==2.16.0",
    "langgraph==1.2.16",
    "langchain-core==1.6.12",
    "pyjwt[crypto]==2.15.1",
    "cryptography==50.0.2",
    "starlette==1.9.0",
    "uvicorn==0.54.0",
    "pydantic==2.14.1",
    "rich==15.0.0",
]

[project.optional-dependencies]
llm = ["langchain-openai==1.7.2"]

[project.scripts]
mandaat-server = "mandaat.server.app:main"
mandaat-bootstrap = "mandaat.bootstrap.keycloak:main"
mandaat-demo = "mandaat.demo:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.1",
    "ty==0.0.90",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mandaat"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "C90", "PL", "N", "ASYNC", "PT"]
# N818: uitzonderingen heten hier ...Fout (Nederlands voor Error).
ignore = ["PLR2004", "RUF001", "RUF002", "RUF003", "N818"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR0913", "PLR0915"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 5
max-positional-args = 5

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integratie: draait tegen de echte compose-keten (Keycloak, dossier-mcp)"]
addopts = "-ra"
