name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kwaliteit:
    name: lint, typen en unittests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: "0.13.1"
      - run: uv sync --frozen --group dev --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check src tests
      - run: uv run pytest -m "not integratie"

  keten:
    name: integratietests tegen Keycloak en de dossier-API
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Demo-omgeving
        run: cp .env.example .env
      - name: Keten starten
        run: docker compose up -d --build --wait
      - name: Integratietests
        run: docker compose run --rm tests
      - name: Demo (drie scenario's en de bewijstabel)
        run: docker compose run --rm demo
      - name: Logs bij falen
        if: failure()
        run: docker compose logs --no-color | tail -300
      - name: Opruimen
        if: always()
        run: docker compose down -v

  terraform:
    name: Terraform Entra-variant (fmt en validate)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: entra/terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.6"
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  geheimen:
    name: geheimenscan (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks
        env:
          # v8.30.1, op digest gepind (multi-arch index)
          GITLEAKS: ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
        run: docker run --rm -v "$PWD:/repo" "$GITLEAKS" git /repo --redact --verbose
