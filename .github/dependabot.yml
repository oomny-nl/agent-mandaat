# Wekelijkse updatevoorstellen; versies blijven exact gepind (lockfile, digests, commit-SHA's).
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # Het image volgt requires-python (3.13); een Python-minorupgrade is een bewuste keuze.
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: terraform
    directory: /entra/terraform
    schedule:
      interval: weekly
