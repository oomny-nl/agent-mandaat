name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kwaliteit:
    name: lint, typen en unittests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.1"
      - run: uv sync --frozen --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check src tests
      - run: uv run pytest -m "not integratie"

  keten:
    name: integratietests tegen Keycloak en de dossier-API
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Demo-omgeving
        run: cp .env.example .env
      - name: Keten starten
        run: docker compose up -d --build --wait
      - name: Integratietests
        run: docker compose run --rm tests
      - name: Demo (alle drie de scenario's)
        run: docker compose run --rm demo
      - name: Logs bij falen
        if: failure()
        run: docker compose logs --no-color | tail -300
      - name: Opruimen
        if: always()
        run: docker compose down -v

  terraform:
    name: Terraform Entra-variant (fmt en validate)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: entra/terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.6"
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  geheimen:
    name: geheimenscan (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact --verbose
